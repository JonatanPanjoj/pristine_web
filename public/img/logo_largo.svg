<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="pristineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89CFF0" />
      <stop offset="50%" stop-color="#48A9E6" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FB" />
      <stop offset="100%" stop-color="#89CFF0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isotipo Icon: Pure Diamond & Sparkle -->
  <g transform="translate(15, 10)">
    <!-- Base Crystal Shape -->
    <path d="M40 5 L70 30 L60 70 L20 70 L10 30 Z" fill="url(#pristineGrad)" />
    <!-- Crystal Facets -->
    <path d="M40 5 L40 70 M40 5 L20 70 M40 5 L60 70" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M10 30 L70 30" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Bright Sparkle -->
    <path d="M62 12 Q65 20 73 23 Q65 26 62 34 Q59 26 51 23 Q59 20 62 12 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  </g>

  <!-- Typography: PRISTINE -->
  <text x="110" y="58" font-family="'Inter', sans-serif" font-size="36" font-weight="800" letter-spacing="4" fill="#1E3A5F">
    PRISTINE
  </text>
  <!-- Subtitle -->
  <text x="112" y="76" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#48A9E6">
    MANAGEMENT PLATFORM
  </text>
</svg>
