version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pristine-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      SERVER_PORT: 5000
      # IP privada de tu Servidor 2 (MongoDB en AWS):
      MONGODB_URI: ${MONGODB_URI:-mongodb://172.31.28.20:27017/pristine}
    networks:
      - pristine-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Ruta relativa: Nginx en el puerto 80 hace proxy directo a backend:5000 (sin problemas de CORS ni IPs)
        REACT_APP_API_URL: /api
        # URL del Servidor 3 de imágenes (SRV-03):
        REACT_APP_STORAGE_URL: ${REACT_APP_STORAGE_URL:-http://3.130.212.65:8080}
    container_name: pristine-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pristine-net

networks:
  pristine-net:
    driver: bridge
